 if(fpScene){for(const model of fpShips)if(!next.includes(model.userData.ship))fpScene.remove(model);fpShips=fpShips.filter(model=>next.includes(model.userData.ship));for(const ship of next)if(!fpShips.some(model=>model.userData.ship===ship)){const model=shipModel(ship);fpScene.add(model);enhanceShipModel(model,ship);fpShips.push(model)}}
 $('tc').textContent=next.length;$('pc').textContent=(snapshot.points||[]).length;
 const control=$('simRate');control.disabled=snapshot.mode!=='simulation';if(snapshot.simulationRate){simRate=snapshot.simulationRate;if(document.activeElement!==control)control.value=simRate;$('simRateValue').textContent=`${simRate} 倍`}
 if(selectedShip&&detailPanel.classList.contains('open'))renderTarget(selectedShip);
}
async function setSimRate(value){try{const response=await fetch('/api/simulation/rate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rate:Number(value)})});if(!response.ok)throw new Error('调速失败');state=await response.json();applyBackendState(state);draw()}catch(error){$('status').textContent='后端调速失败';$('status').className='warn'}}
const speedControl=document.createElement('div');speedControl.className='sim-speed';speedControl.innerHTML='<span>仿真速度</span><input id="simRate" type="range" min="1" max="20" value="5"><b id="simRateValue">5 倍</b>';document.querySelector('.top').append(speedControl);document.getElementById('simRate').disabled=true;document.getElementById('simRate').oninput=e=>{$('simRateValue').textContent=`${e.target.value} 倍`};document.getElementById('simRate').onchange=e=>setSimRate(e.target.value);document.querySelector('.radar-info').innerHTML='<b>南沙大酒店</b><br>东经 113.613836°　北纬 22.766758°<br>朝向：南偏东外海（160°）<br>探测半径：40 千米<div class="radar-controls"><button id="radarRange">量程 40 千米</button><button id="radarMode">扇区扫描</button><button id="radarCenter">雷达居中</button><button id="radarTracks">隐藏航迹</button></div>';document.getElementById('sector').parentElement.lastChild.textContent=' 雷达扇区（40 千米）';document.querySelector('.top b').textContent='分布式雷达显控终端';const oldSubtitle=document.querySelector('.top>span'),brand=document.createElement('div');brand.className='hit-brand';brand.innerHTML='<img class="hit-brand-crop" src="/assets/hit-brand-source.png" alt="哈尔滨工业大学校徽与校名">';oldSubtitle.replaceWith(brand);document.querySelector('.bottom span:nth-child(3)').textContent='岛屿数据 © 开放街图贡献者';
$('coords').textContent='东经 —　北纬 —';
$('radarTracks').textContent='隐藏编号';
function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);resize3D();draw()}
function tile(x,y,layer=1){const n=2**z,xn=(x%n+n)%n,yn=Math.max(0,Math.min(n-1,y)),k=`${mapIndex}/${layer}/${z}/${xn}/${yn}`;if(cache.has(k))return cache.get(k);const im=new Image;im.onload=()=>{cache.set(k,im);draw()};im.src=maps[mapIndex][layer](z,xn,yn);cache.set(k,0);return 0}
function drawRadar(){const r=pos(radar.lon,radar.lat),end=dest(radar,radarRange,sectorBearing),edge=pos(end.lon,end.lat),a=Math.atan2(edge.y-r.y,edge.x-r.x),range=Math.hypot(edge.x-r.x,edge.y-r.y),half=sectorHalfAngle*Math.PI/180;if(radarVisible){g.fillStyle='#ffad2038';g.strokeStyle='#ffc04f';g.lineWidth=2;g.beginPath();if(radarMode==='omni')g.arc(r.x,r.y,range,0,Math.PI*2);else{g.moveTo(r.x,r.y);g.arc(r.x,r.y,range,a-half,a+half);g.closePath()}g.fill();g.stroke();if(radarMode==='sector'){g.setLineDash([6,5]);g.beginPath();g.moveTo(r.x,r.y);g.lineTo(edge.x,edge.y);g.stroke();g.setLineDash([])}}g.fillStyle='#ffc04f';g.beginPath();g.arc(r.x,r.y,7,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.font='12px Arial';g.fillStyle='#fff';g.fillText('雷达 · 南沙大酒店',r.x+11,r.y-10)}
function drawShip(s,live=moved(s)){const p=pos(live.lon,live.lat),a=live.course*Math.PI/180,color=s.threat?'#ff4d4d':'#20ed71',length=8+s.speed*.65,active=s===selectedShip;if(active){g.save();g.strokeStyle='#79efff';g.lineWidth=3;g.shadowColor='#45e9ff';g.shadowBlur=18;g.beginPath();g.arc(p.x,p.y,15+Math.sin(performance.now()*.006)*2,0,Math.PI*2);g.stroke();g.restore()}g.strokeStyle=active?'#b9f8ff':color;g.fillStyle=active?'#7cefff':color;g.lineWidth=active?3:2;g.save();if(active){g.shadowColor='#45e9ff';g.shadowBlur=14}g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+Math.sin(a)*length,p.y-Math.cos(a)*length);g.stroke();g.translate(p.x,p.y);g.rotate(a);g.beginPath();g.moveTo(0,-9);g.lineTo(6,7);g.lineTo(0,4);g.lineTo(-6,7);g.closePath();g.fill();g.restore();if($('labels').checked){g.font=active?'bold 12px Arial':'11px Arial';g.fillStyle=active?'#b9f8ff':color;g.fillText(`${s.id}  ${s.speed}节`,p.x+8,p.y+14)}}
function drawHistory(s){const history=shipHistories.get(s)||[];if(history.length<2)return;const points=history.map(p=>pos(p.lon,p.lat));g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle='#58ecff';g.lineWidth=4;g.shadowColor='#16dfff';g.shadowBlur=12;g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.shadowBlur=0;g.setLineDash([4,5]);g.strokeStyle='#d6fbff';g.lineWidth=1;g.stroke();g.setLineDash([]);const start=points[0],end=points[points.length-1];for(const [p,label,color] of [[start,'起点','#ffd166'],[end,'当前位置','#65ff9a']]){g.fillStyle=color;g.beginPath();g.arc(p.x,p.y,6,0,Math.PI*2);g.fill();g.fillStyle='#eaffff';g.font='bold 12px Arial';g.fillText(label,p.x+9,p.y-8)}g.restore()}
function draw(){if(firstPerson&&selectedShip){const live=moved(selectedShip);center={lon:live.lon,lat:live.lat}}g.fillStyle='#071522';g.fillRect(0,0,W,H);if(mapIndex===3){if(qtChart.complete&&qtChart.naturalWidth)g.drawImage(qtChart,0,0,W,H);return}const cx=mx(center.lon),cy=my(center.lat);if($('tiles').checked){for(let x=Math.floor((cx-W/2)/256);x<=Math.floor((cx+W/2)/256);x++)for(let y=Math.floor((cy-H/2)/256);y<=Math.floor((cy+H/2)/256);y++){const dx=x*256-cx+W/2,dy=y*256-cy+H/2,im=tile(x,y),labels=maps[mapIndex][2]&&tile(x,y,2);if(im)g.drawImage(im,dx,dy,256,256);if(labels)g.drawImage(labels,dx,dy,256,256)}}if($('grid').checked){g.strokeStyle='#1a4660';for(let x=0;x<W;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}drawRadar();if(trailShip&&!firstPerson)drawHistory(trailShip);for(const s of simShips)drawShip(s);if(firstPerson&&selectedShip){const live=moved(selectedShip);g.fillStyle='#8de3ff';g.fillRect(W/2-115,18,230,30);g.fillStyle='#062039';g.font='bold 13px Arial';g.fillText(`第一视角 · ${selectedShip.name} · 航向 ${live.course.toFixed(0)}°`,W/2-103,38)}}
async function poll(){if(paused)return;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);state=await r.json();applyBackendState(state);$('status').textContent=state.mode==='simulation'?'后端仿真数据已连接':state.mode==='live'?'已收到 ZMQ 消息':'等待 ZMQ 航迹数据';$('status').className=state.mode==='waiting'?'warn':'ok';$('updated').textContent=state.updatedUtc?new Date(state.updatedUtc).toLocaleTimeString('zh-CN'):'—';draw()}catch(e){$('status').textContent='数据服务未连接 · 船位已冻结';$('status').className='warn';$('simRate').disabled=true}setTimeout(poll,800)}
$('basemap').onclick=()=>{mapIndex=(mapIndex+1)%maps.length;cache.clear();$('basemap').textContent=`底图：${maps[mapIndex][0]}`;draw()};qtChart.onload=draw;setInterval(()=>{if(mapIndex===3)qtChart.src=`/api/chart.png?t=${Date.now()}`},1000);function setZoom(value){z=Math.max(5,Math.min(18,value));$('zoom').value=z;cache.clear();draw()}function locateRadar(){z=11;center=dest(radar,15,sectorBearing);$('zoom').value=z;cache.clear();draw()}$('mapReset').onclick=locateRadar;$('locateRadar').onclick=locateRadar;$('zoomIn').onclick=()=>setZoom(z+1);$('zoomOut').onclick=()=>setZoom(z-1);$('sector').onchange=e=>{radarVisible=e.target.checked;draw()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';if(!paused)poll()};$('zoom').oninput=e=>setZoom(+e.target.value);c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,lon:center.lon,lat:center.lat};c.classList.add('drag');c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(mapIndex===3)return;const wx=mx(center.lon)+e.offsetX-W/2,wy=my(center.lat)+e.offsetY-H/2,n=Math.PI-2*Math.PI*wy/(256*2**z),lon=wx/(256*2**z)*360-180,lat=Math.atan(Math.sinh(n))*180/Math.PI,lonLabel=lon>=0?'东经':'西经',latLabel=lat>=0?'北纬':'南纬';$('coords').textContent=`${lonLabel} ${Math.abs(lon).toFixed(6)}°　${latLabel} ${Math.abs(lat).toFixed(6)}°`;if(!drag)return;center.lon=drag.lon-(e.clientX-drag.x)*360/(256*2**z);center.lat=drag.lat+(e.clientY-drag.y)*360/(256*2**z);draw()};c.onpointerleave=()=>{$('coords').textContent='东经 —　北纬 —'};c.onpointerup=()=>{drag=null;c.classList.remove('drag')};c.onwheel=e=>{if(mapIndex===3)return;e.preventDefault();setZoom(z+(e.deltaY<0?1:-1))};
$('radarRange').onclick=()=>{radarRange=radarRange===20?40:radarRange===40?60:20;$('radarRange').textContent=`量程 ${radarRange} 千米`;draw()};$('radarMode').onclick=()=>{radarMode=radarMode==='sector'?'omni':'sector';$('radarMode').textContent=radarMode==='sector'?'扇区扫描':'全向扫描';draw()};$('radarCenter').onclick=locateRadar;$('radarTracks').onclick=()=>{const labels=$('labels');labels.checked=!labels.checked;$('radarTracks').textContent=labels.checked?'隐藏编号':'显示编号';draw()};$('pause').remove();function togglePanel(side,id){const el=document.querySelector(`.${side}-panel`),button=$(id),collapsed=el.classList.toggle('collapsed');button.textContent=collapsed?(side==='left'?'›':'‹'):(side==='left'?'‹':'›')}$('leftToggle').onclick=()=>togglePanel('left','leftToggle');$('rightToggle').onclick=()=>togglePanel('right','rightToggle');addEventListener('resize',resize);resize();poll();
c.addEventListener('click',e=>{if(mapIndex===3)return;const hit=simShips.find(s=>{const live=moved(s),p=pos(live.lon,live.lat);return Math.hypot(p.x-e.offsetX,p.y-e.offsetY)<18});if(hit){renderTarget(hit);draw()}});addEventListener('keydown',e=>{if(e.key==='Escape'&&firstPerson)setFirstPerson(false)});
</script>
